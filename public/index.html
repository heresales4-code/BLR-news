<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BLR. — Bangalore, in short</title>

<!-- AdSense site-ownership verification tag (from Google's dashboard).
     Kept here permanently, separate from the ad-unit rendering logic below,
     since verification needs this script present regardless of whether
     ADSENSE_SLOT_ID has been filled in yet. -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5470065566779943" crossorigin="anonymous"></script>

<!--
  ADSENSE CONFIG
  Once your AdSense account is approved:
  1. Fill in ADSENSE_CLIENT_ID (looks like "ca-pub-1234567890123456") and
     ADSENSE_SLOT_ID (a per-ad-unit number from your AdSense dashboard) near
     the top of the JavaScript section, further down this file.
  2. Deploy the app to a live domain — AdSense won't serve real ads on
     localhost, only on the public URL you registered.
  3. Add an ads.txt file at your domain's root (see public/ads.txt in this
     project — fill in your publisher ID there too).
  Until both IDs are filled in, the app shows the friendly "Advertisement"
  placeholder instead, so you can keep developing without broken ad requests.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F7FA;
    --surface:#FFFFFF;
    --text:#16161F;
    --muted:#6B6B78;
    --violet:#8B5CF6;
    --pink:#EC4899;
    --orange:#F97316;
    --border:#E4E4EC80;
    --border-solid:#E4E4EC;
    --radius:16px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:76px;
  }
  header{
    position:sticky; top:0; z-index:20;
    background:#0F172A;
    padding:18px 24px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .wordmark{
    font-family:'Space Grotesk',sans-serif;
    font-weight:800; font-size:22px; letter-spacing:-0.01em;
    color:#fff;
  }
  .wordmark .dot-suffix{color:#FB923C;}
  .meta-time{
    font-family:'JetBrains Mono',monospace;
    font-size:11px; color:rgba(255,255,255,0.65);
    text-align:right; line-height:1.4;
  }
  .meta-time b{color:#fff; display:block; font-size:12px;}

  .glow-bar{ display:none; }

  .chips{
    display:flex; gap:8px; overflow-x:auto;
    padding:16px 18px; scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    font-family:'JetBrains Mono',monospace; font-weight:500;
    font-size:11px; text-transform:uppercase; letter-spacing:0.04em;
    padding:8px 15px; border-radius:999px;
    border:1px solid var(--border-solid);
    background:var(--surface);
    color:var(--muted);
    white-space:nowrap;
    cursor:pointer;
    transition:all .15s ease;
  }
  .chip.active{
    border-color:transparent;
    color:#fff;
    background:linear-gradient(90deg,#8B5CF6,#EC4899);
  }

  .feed{
    max-width:720px; margin:0 auto;
    padding:16px;
    display:flex; flex-direction:column; gap:20px;
  }

  .search-wrap{ max-width:720px; margin:0 auto; padding:0 16px 8px; }
  .search-input{
    width:100%; padding:11px 16px; border-radius:10px;
    border:1px solid var(--border-solid); background:var(--surface);
    color:var(--text); font-family:'Inter',sans-serif; font-size:14px;
    outline:none;
  }
  .search-input::placeholder{ color:var(--muted); }
  .search-input:focus{ border-color:var(--violet); }

  .card{
    position:relative;
    background:var(--surface);
    border:1px solid var(--border-solid);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:0 2px 12px rgba(16,16,40,0.07);
  }
  .card-image-badge{
    position:absolute; top:14px; left:14px; z-index:2;
    background:#0F172A; color:#fff;
    font-family:'JetBrains Mono',monospace; font-weight:700;
    font-size:10px; letter-spacing:0.06em; text-transform:uppercase;
    padding:5px 11px; border-radius:6px;
  }
  .card-image{
    width:100%; aspect-ratio:16/9; object-fit:cover;
    display:block; background:#F0F0F5;
  }
  .card-body{ padding:20px; }
  .eyebrow{
    display:inline-flex; align-items:center;
    font-family:'JetBrains Mono',monospace; font-weight:600;
    font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em;
    padding:4px 10px; border-radius:999px;
    margin-bottom:12px;
  }
  .dot{width:7px; height:7px; border-radius:50%; flex:0 0 auto; box-shadow:0 0 8px currentColor;}
  h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:19px; line-height:1.3; font-weight:700;
    margin-bottom:8px; letter-spacing:-0.01em;
    color:var(--text);
  }
  p.summary{
    font-size:14.5px; line-height:1.55; color:#4B4B58;
    margin-bottom:14px;
  }
  .card-footer{
    display:flex; align-items:center; justify-content:space-between;
    font-family:'JetBrains Mono',monospace;
    font-size:11px; color:var(--muted);
  }
  .card-actions{ display:flex; align-items:center; gap:14px; }
  .bookmark-btn{
    background:none; border:none; cursor:pointer; padding:0;
    color:var(--muted); display:flex; align-items:center;
  }
  .bookmark-btn svg{ width:17px; height:17px; }
  .bookmark-btn.saved{ color:var(--orange); }
  .bookmark-btn.saved svg{ fill:var(--orange); }
  .read-more{
    display:flex; align-items:center; gap:4px;
    color:var(--pink); font-family:'Inter',sans-serif;
    font-size:12.5px; font-weight:700; cursor:pointer;
    text-decoration:none;
  }

  /* Ad slot */
  .ad-slot{
    border:1.5px dashed #D9CCEC;
    border-radius:var(--radius);
    padding:22px 18px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px;
    background:#FAF7FE;
    color:#8A7FA0;
    text-align:center;
    min-height:100px;
  }
  .ad-slot .ad-label{
    font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:11px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--violet);
  }
  .ad-slot .ad-sub{
    font-size:12px; color:#9B8FB0;
  }
  .ad-unit-wrap{
    border-radius:var(--radius); overflow:hidden;
    min-height:100px; display:flex; align-items:center; justify-content:center;
    background:var(--surface); border:1px solid var(--border-solid);
  }

  /* Bottom nav */
  nav.bottom{
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    background:var(--surface);
    border-top:1px solid var(--border-solid);
    display:flex; justify-content:space-around;
    padding:10px 8px calc(10px + env(safe-area-inset-bottom));
  }
  .nav-item{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    color:var(--muted); font-size:10px; font-family:'JetBrains Mono',monospace;
    cursor:pointer;
  }
  .nav-item.active{color:var(--pink);}
  .nav-item svg{width:20px; height:20px;}

  @media (min-width:640px){
    .feed{padding:22px 0;}
  }

  .footer-links{
    max-width:720px; margin:8px auto 0; padding:0 16px;
    text-align:center; font-size:12px; color:var(--muted);
  }
  .footer-links a{ color:var(--muted); text-decoration:none; }
  .footer-links a:hover{ color:var(--pink); }

  /* ---- Desktop 3-column layout ---- */
  .app-shell{ display:block; }
  .sidebar{ display:none; }

  @media (min-width:1000px){
    .app-shell{
      display:grid;
      grid-template-columns:250px 1fr 300px;
      gap:24px;
      max-width:1360px; margin:0 auto;
      padding:24px;
      align-items:start;
    }
    .sidebar{ display:flex; flex-direction:column; gap:20px; position:sticky; top:88px; }
    .main-column .chips{ display:none; } /* sidebar nav replaces chip filters on desktop */
    .main-column .search-wrap, .main-column .feed, .main-column .footer-links{ max-width:none; padding-left:0; padding-right:0; }
    nav.bottom{ display:none; } /* sidebar nav replaces bottom tab bar on desktop */
    body{ padding-bottom:0; }
  }

  .sidebar-card{
    background:var(--surface); border:1px solid var(--border-solid);
    border-radius:14px; padding:18px;
    box-shadow:0 2px 12px rgba(16,16,40,0.06);
  }
  .sidebar-title{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px;
    margin-bottom:12px; color:var(--text);
  }
  .sidebar-nav-item{
    display:block; width:100%; text-align:left;
    background:none; border:none; cursor:pointer;
    font-family:'Inter',sans-serif; font-weight:600; font-size:14px;
    color:var(--text); padding:10px 12px; border-radius:10px;
    margin-bottom:2px;
  }
  .sidebar-nav-item:hover{ background:#F3F0FA; }
  .sidebar-nav-item.active{ background:#0F172A; color:#fff; }

  .weather-widget .weather-label{
    font-family:'JetBrains Mono',monospace; font-weight:600; font-size:10.5px;
    letter-spacing:0.06em; color:var(--orange); margin-bottom:8px;
  }
  .weather-widget .weather-temp{
    font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:32px; color:var(--text);
  }
  .weather-widget .weather-desc{ font-size:13px; color:var(--muted); margin-top:4px; }

  .sidebar-widget-title{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px;
    margin-bottom:14px; color:var(--text);
  }
  .trending-item{
    padding:10px 0; border-bottom:1px solid var(--border-solid);
  }
  .trending-item:last-child{ border-bottom:none; }
  .trending-item .trending-rank{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--muted);
    text-transform:uppercase; margin-bottom:4px;
  }
  .trending-item .trending-headline{
    font-size:13.5px; font-weight:600; color:var(--text); line-height:1.4;
    text-decoration:none; display:block;
  }
  .trending-item .trending-headline:hover{ color:var(--violet); }

  .newsletter-widget p{ font-size:13px; color:var(--muted); margin-bottom:14px; line-height:1.5; }
  .newsletter-widget input{
    width:100%; padding:11px 14px; border-radius:10px;
    border:1px solid var(--border-solid); font-family:'Inter',sans-serif; font-size:13.5px;
    margin-bottom:10px; box-sizing:border-box;
  }
  .newsletter-widget button{
    width:100%; padding:11px; border-radius:10px; border:none;
    background:#0F172A; color:#fff; font-weight:700; font-size:13.5px;
    cursor:pointer; font-family:'Inter',sans-serif;
  }
  .newsletter-widget button:disabled{ opacity:0.6; cursor:default; }
  .newsletter-msg{ font-size:12.5px; margin-top:10px; }
  .newsletter-msg.success{ color:#059669; }
  .newsletter-msg.error{ color:#E11D48; }

  /* ---- Featured hero story (desktop only) ---- */
  .featured-card{
    display:none;
  }
  @media (min-width:1000px){
    .featured-card.has-story{
      display:block;
      background:var(--surface); border-left:5px solid var(--orange);
      border-radius:14px; padding:22px 24px; margin-bottom:20px;
      box-shadow:0 2px 12px rgba(16,16,40,0.06);
    }
  }
  .featured-badge{
    display:inline-flex; align-items:center; gap:6px;
    background:#FFF1E6; color:var(--orange); font-weight:700;
    font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:0.05em;
    padding:5px 12px; border-radius:999px; margin-bottom:12px;
  }
  .featured-badge::before{ content:''; width:6px; height:6px; border-radius:50%; background:var(--orange); }
  .featured-card h2{ font-size:24px; margin-bottom:10px; }
  .featured-card .featured-link{
    color:var(--violet); font-weight:700; font-size:13.5px; text-decoration:none;
  }
</style>
</head>
<body>

  <header>
    <div class="wordmark">BLR<span class="dot-suffix">.</span></div>
    <div class="meta-time">
      <b id="clock">--:--</b>
      <span id="dateline">Bengaluru</span>
    </div>
  </header>
  <div class="glow-bar"></div>

  <div class="app-shell">
    <aside class="sidebar sidebar-left">
      <div class="sidebar-card">
        <div class="sidebar-title">BLR. Sections</div>
        <nav id="sidebarNav">
          <button class="sidebar-nav-item active" data-cat="All">All Stories</button>
          <button class="sidebar-nav-item" data-cat="Traffic">Traffic</button>
          <button class="sidebar-nav-item" data-cat="Civic">Civic</button>
          <button class="sidebar-nav-item" data-cat="Tech">Tech</button>
          <button class="sidebar-nav-item" data-cat="Metro">Metro</button>
          <button class="sidebar-nav-item" data-cat="Karnataka">Karnataka</button>
          <button class="sidebar-nav-item" data-cat="Sports">Sports</button>
        </nav>
      </div>
      <div class="sidebar-card weather-widget">
        <div class="weather-label">LOCAL WEATHER</div>
        <div class="weather-temp" id="weatherTemp">--°</div>
        <div class="weather-desc" id="weatherDesc">Loading forecast…</div>
      </div>
    </aside>

    <div class="main-column">
      <div class="chips">
        <div class="chip active">All</div>
        <div class="chip">Traffic</div>
        <div class="chip">Civic</div>
        <div class="chip">Tech</div>
        <div class="chip">Metro</div>
        <div class="chip">Karnataka</div>
        <div class="chip">Sports</div>
      </div>

      <div class="search-wrap">
        <input type="text" id="searchInput" class="search-input" placeholder="Search stories…" autocomplete="off">
      </div>

      <!-- Real ad unit (Adsterra Native Banner) — placed as static HTML rather
           than inside the dynamically-updated feed area, since browsers block
           <script> tags from executing when inserted via innerHTML/JS, and
           this ad is tied to one fixed container ID meant to appear once. -->
      <div class="ad-unit-wrap" style="margin-bottom:20px;">
        <script async="async" data-cfasync="false" src="https://pl31211163.profitableratecpmnetwork.com/77381325c854ea93ccaf680479378180/invoke.js"></script>
        <div id="container-77381325c854ea93ccaf680479378180"></div>
      </div>

      <div class="featured-card" id="featuredCard"></div>

      <main class="feed" id="feed"></main>

      <div class="footer-links">
        <a href="/privacy.html">Privacy Policy</a>
      </div>
    </div>

    <aside class="sidebar sidebar-right">
      <div class="sidebar-card trending-widget">
        <div class="sidebar-widget-title">📈 Top Stories Right Now</div>
        <div id="trendingList"></div>
      </div>
      <div class="sidebar-card newsletter-widget">
        <div class="sidebar-widget-title">Get the Daily Pulse</div>
        <p>Top Bangalore stories delivered to your inbox every morning.</p>
        <form id="newsletterForm">
          <input type="email" id="newsletterEmail" placeholder="Your email address" required>
          <button type="submit" id="newsletterBtn">Subscribe</button>
        </form>
        <div class="newsletter-msg" id="newsletterMsg"></div>
      </div>
    </aside>
  </div>

  <nav class="bottom">
    <div class="nav-item active" id="navHome">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      Home
    </div>
    <div class="nav-item" style="opacity:.4; cursor:default;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
      Trending
    </div>
    <div class="nav-item" id="navSaved">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4V3z"/></svg>
      Saved
    </div>
    <div class="nav-item" id="navNotify">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span id="notifyLabel">Notify</span>
    </div>
  </nav>

<script>
  // ---- Live clock ----
  function tick(){
    const d = new Date();
    document.getElementById('clock').textContent =
      d.toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'});
    document.getElementById('dateline').textContent =
      d.toLocaleDateString('en-IN', {weekday:'short', day:'numeric', month:'short'}) + ' · Bengaluru';
  }
  tick(); setInterval(tick, 30000);

  // ---- Mock content (swap for RSS/API feed later) ----
  const CATS = {
    Traffic: '#E11D48',
    Civic: '#059669',
    Tech: '#4F46E5',
    Metro: '#D97706',
    Karnataka: '#9333EA',
    Sports: '#0891B2'
  };

  // Fallback mock data — used only if the /api/news backend isn't reachable
  // (e.g. you're opening this file directly instead of running `node server.js`)
  const FALLBACK_STORIES = [
    {cat:'Metro', headline:'Yellow Line trial runs begin between RV Road and Bommasandra', summary:'BMRCL has started trial runs on the Yellow Line, connecting RV Road to Electronics City and Bommasandra. Commercial operations are expected in the coming months, easing the commute for thousands working along the Hosur Road tech corridor.', source:'Metro Desk', time:'18m ago'},
    {cat:'Traffic', headline:'Silk Board junction to see night-time lane restrictions this week', summary:'BBMP traffic police have announced temporary night closures near Silk Board for underpass maintenance work. Commuters are advised to use the Hosur Road service lane or plan alternate routes between 11pm and 5am through Thursday.', source:'Traffic Desk', time:'42m ago'},
    {cat:'Civic', headline:'BBMP begins pothole survey ahead of monsoon season', summary:'Civic body teams have started ward-wise road audits across the city, flagging over 400 stretches for repair before the rains intensify. Residents can report potholes via the BBMP app, officials said, promising a two-week turnaround.', source:'Civic Desk', time:'1h ago'},
    {cat:'Tech', headline:'Whitefield tech park adds new shuttle routes for employees', summary:'A major tech park in Whitefield has expanded its shuttle network to cover Marathahalli and KR Puram, aiming to cut employee commute times. The move comes as more firms return to hybrid office schedules this quarter.', source:'Business Desk', time:'2h ago'}
  ];

  const feed = document.getElementById('feed');

  // ---- Bookmarks (stored in this browser via localStorage) ----
  const SAVED_KEY = 'blr_saved_articles';

  function getSavedStories(){
    try { return JSON.parse(localStorage.getItem(SAVED_KEY) || '{}'); }
    catch { return {}; }
  }
  function setSavedStories(obj){
    localStorage.setItem(SAVED_KEY, JSON.stringify(obj));
  }
  function storyId(s){ return s.link || s.headline; }
  function isSaved(id){ return !!getSavedStories()[id]; }
  function toggleSaved(story){
    const saved = getSavedStories();
    const id = storyId(story);
    if (saved[id]) delete saved[id];
    else saved[id] = story;
    setSavedStories(saved);
    refresh();
  }

  function bookmarkIcon(active){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M6 4h12v17l-6-4-6 4V4z"/>
    </svg>`;
  }

  // ---- App state ----
  let allStories = [];
  let currentMode = 'home';      // 'home' | 'saved'
  let currentCategory = 'All';
  let currentSearch = '';

  function computeVisibleStories(){
    let source = currentMode === 'saved'
      ? Object.values(getSavedStories()).sort((a, b) => new Date(b.pubDate || 0) - new Date(a.pubDate || 0))
      : allStories;

    if (currentCategory !== 'All') {
      source = source.filter(s => s.cat === currentCategory);
    }
    if (currentSearch.trim()) {
      const q = currentSearch.trim().toLowerCase();
      source = source.filter(s =>
        (s.headline || '').toLowerCase().includes(q) ||
        (s.summary || '').toLowerCase().includes(q)
      );
    }
    return source;
  }

  // ---- AdSense config ----
  // Client ID is filled in (it doesn't change once your account is
  // approved). ADSENSE_SLOT_ID stays blank until you create your first ad
  // unit in the AdSense dashboard — the placeholder stays showing until then.
  const ADSENSE_CLIENT_ID = 'ca-pub-5470065566779943';
  const ADSENSE_SLOT_ID = '';   // e.g. '9876543210' — fill in once you create an ad unit
  const ADSENSE_ENABLED = !!(ADSENSE_CLIENT_ID && ADSENSE_SLOT_ID);

  let adUnitCounter = 0;
  // Note: the adsbygoogle.js script itself now loads via a static tag in
  // <head> (needed for AdSense's site-ownership verification), so no
  // separate dynamic script-loading here — this just handles rendering
  // individual ad units once a slot ID is configured.

  function adSlot(size){
    if (!ADSENSE_ENABLED) {
      return `<div class="ad-slot">
        <div class="ad-label">Advertisement</div>
        <div class="ad-sub">${size} · space reserved for ad partner</div>
      </div>`;
    }
    adUnitCounter++;
    return `<div class="ad-unit-wrap">
      <ins class="adsbygoogle"
        id="ad-unit-${adUnitCounter}"
        style="display:block;width:100%"
        data-ad-client="${ADSENSE_CLIENT_ID}"
        data-ad-slot="${ADSENSE_SLOT_ID}"
        data-ad-format="auto"
        data-full-width-responsive="true"></ins>
    </div>`;
  }

  // AdSense only auto-initializes units present at page load — anything
  // inserted dynamically (like our feed cards) needs its own push() call.
  function initNewAdUnits(){
    if (!ADSENSE_ENABLED || !window.adsbygoogle) return;
    document.querySelectorAll('ins.adsbygoogle:not([data-adsbygoogle-status])').forEach(() => {
      try { (window.adsbygoogle = window.adsbygoogle || []).push({}); }
      catch (err) { console.warn('AdSense push failed:', err); }
    });
  }

  function emptyState(){
    if (currentMode === 'saved') {
      return `<div class="ad-slot" style="border-color:#D9CCEC;">
        <div class="ad-label">No saved stories yet</div>
        <div class="ad-sub">Tap the bookmark icon on any story to save it here</div>
      </div>`;
    }
    return `<div class="ad-slot" style="border-color:#D9CCEC;">
      <div class="ad-label">No stories match</div>
      <div class="ad-sub">Try a different category or search term</div>
    </div>`;
  }

  const isDesktopLayout = () => window.matchMedia('(min-width: 1000px)').matches;

  function renderFeaturedCard(story){
    const featuredEl = document.getElementById('featuredCard');
    if (!story || currentMode !== 'home' || !isDesktopLayout()) {
      featuredEl.classList.remove('has-story');
      featuredEl.innerHTML = '';
      return;
    }
    featuredEl.classList.add('has-story');
    featuredEl.innerHTML = `
      <div class="featured-badge">Latest</div>
      <h2>${story.headline}</h2>
      ${story.summary ? `<p class="summary" style="margin-bottom:14px;">${story.summary}</p>` : ''}
      <a class="featured-link" href="${story.link || '#'}" target="_blank" rel="noopener">Read Full Story →</a>
    `;
  }

  function renderStories(stories, opts = {}){
    feed.innerHTML = '';

    // On desktop, the newest story gets pulled into the featured hero slot
    // above the feed instead of appearing twice (there and in the grid) —
    // only for the general "All" view, so filtering to a category with just
    // one story never leaves the grid looking empty
    let gridStories = stories;
    if (currentMode === 'home' && currentCategory === 'All' && isDesktopLayout() && stories.length) {
      renderFeaturedCard(stories[0]);
      gridStories = stories.slice(1);
    } else {
      renderFeaturedCard(null);
    }

    if (opts.banner) {
      feed.insertAdjacentHTML('beforeend', opts.banner);
    }

    if (!gridStories.length) {
      feed.insertAdjacentHTML('beforeend', emptyState());
      return;
    }

    gridStories.forEach((s, i) => {
      const color = CATS[s.cat] || '#8A8370';
      const id = storyId(s);
      const saved = isSaved(id);
      const imageBlock = s.image
        ? `<div style="position:relative;"><img class="card-image" src="${s.image}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentElement.remove()"><div class="card-image-badge">${s.cat}</div></div>`
        : '';
      feed.insertAdjacentHTML('beforeend', `
        <article class="card" style="border-left:4px solid ${color};">
          ${imageBlock}
          <div class="card-body">
            <div class="eyebrow" style="background:${color}22; color:${color};">
              ${s.cat}
            </div>
            <h2>${s.headline}</h2>
            ${s.summary ? `<p class="summary">${s.summary}</p>` : ''}
            <div class="card-footer">
              <span>${s.source} · ${s.time || ''}</span>
              <div class="card-actions">
                <button class="bookmark-btn${saved ? ' saved' : ''}" data-id="${id}" aria-label="Save story" type="button">
                  ${bookmarkIcon(saved)}
                </button>
                <a class="read-more" href="${s.link || '#'}" target="_blank" rel="noopener">Read more →</a>
              </div>
            </div>
          </div>
        </article>
      `);
      if (currentMode === 'home' && (i + 1) % 4 === 0 && i !== gridStories.length - 1) {
        feed.insertAdjacentHTML('beforeend', adSlot('320×100'));
      }
    });

    if (currentMode === 'home') {
      feed.insertAdjacentHTML('beforeend', adSlot('300×250'));
    }

    // Wire up bookmark buttons for the cards just rendered
    feed.querySelectorAll('.bookmark-btn').forEach(btn => {
      btn.onclick = () => {
        const story = gridStories.find(s => storyId(s) === btn.dataset.id);
        if (story) toggleSaved(story);
      };
    });

    initNewAdUnits();
  }

  function refresh(){
    renderStories(computeVisibleStories());
  }

  // ---- Category chips + sidebar nav (kept in sync with each other) ----
  function setCategory(cat){
    currentCategory = cat;
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.textContent.trim() === cat));
    document.querySelectorAll('.sidebar-nav-item').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
    refresh();
  }
  document.querySelectorAll('.chip').forEach(chip => {
    chip.onclick = () => setCategory(chip.textContent.trim());
  });
  document.querySelectorAll('.sidebar-nav-item').forEach(btn => {
    btn.onclick = () => setCategory(btn.dataset.cat);
  });

  // Re-render when crossing the desktop breakpoint, so the featured hero
  // slot appears/disappears correctly on live window resizing
  window.matchMedia('(min-width: 1000px)').addEventListener('change', refresh);

  // ---- Search ----
  const searchInput = document.getElementById('searchInput');
  searchInput.addEventListener('input', () => {
    currentSearch = searchInput.value;
    refresh();
  });

  // ---- Home / Saved nav tabs ----
  document.getElementById('navHome').onclick = () => {
    currentMode = 'home';
    document.getElementById('navHome').classList.add('active');
    document.getElementById('navSaved').classList.remove('active');
    refresh();
  };
  document.getElementById('navSaved').onclick = () => {
    currentMode = 'saved';
    document.getElementById('navSaved').classList.add('active');
    document.getElementById('navHome').classList.remove('active');
    refresh();
  };

  async function loadNews(){
    try {
      const res = await fetch('/api/news');
      if (!res.ok) throw new Error('bad response');
      const data = await res.json();
      if (!data.stories || !data.stories.length) throw new Error('empty');
      allStories = data.stories;
      refresh();
      renderTrending(allStories);
    } catch (err) {
      // Backend not running / not deployed yet — show fallback data with a subtle notice
      allStories = FALLBACK_STORIES;
      renderStories(computeVisibleStories(), {
        banner: `<div class="ad-slot" style="border-color:#D9CCEC;">
          <div class="ad-label">Offline preview</div>
          <div class="ad-sub">Showing sample stories — run \`node server.js\` to load live news</div>
        </div>`
      });
      renderTrending(allStories);
    }
  }

  // ---- Push notifications ----
  function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const rawData = window.atob(base64);
    return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
  }

  const navNotify = document.getElementById('navNotify');
  const notifyLabel = document.getElementById('notifyLabel');

  function setNotifyUI(subscribed){
    navNotify.classList.toggle('active', subscribed);
    notifyLabel.textContent = subscribed ? 'On' : 'Notify';
  }

  async function initPushUI(){
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
      navNotify.style.opacity = '.4';
      navNotify.style.cursor = 'default';
      notifyLabel.textContent = 'N/A';
      return;
    }
    try {
      const reg = await navigator.serviceWorker.register('/service-worker.js');
      const existing = await reg.pushManager.getSubscription();
      setNotifyUI(!!existing);
    } catch (err) {
      console.warn('Service worker registration failed:', err);
    }
  }

  async function subscribeToPush(){
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') return;

    const reg = await navigator.serviceWorker.ready;
    const { publicKey } = await fetch('/api/vapid-public-key').then(r => r.json());
    const subscription = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(publicKey)
    });

    await fetch('/api/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(subscription)
    });
    setNotifyUI(true);
  }

  async function unsubscribeFromPush(){
    const reg = await navigator.serviceWorker.ready;
    const subscription = await reg.pushManager.getSubscription();
    if (subscription) {
      await fetch('/api/unsubscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ endpoint: subscription.endpoint })
      });
      await subscription.unsubscribe();
    }
    setNotifyUI(false);
  }

  navNotify.onclick = async () => {
    const reg = await navigator.serviceWorker?.ready.catch(() => null);
    const existing = reg ? await reg.pushManager.getSubscription() : null;
    if (existing) unsubscribeFromPush();
    else subscribeToPush();
  };

  initPushUI();

  loadNews();

  // ---- Weather widget (Open-Meteo — free, no API key required) ----
  const WEATHER_CODES = {
    0:'Clear sky', 1:'Mostly clear', 2:'Partly cloudy', 3:'Overcast',
    45:'Foggy', 48:'Foggy',
    51:'Light drizzle', 53:'Drizzle', 55:'Heavy drizzle',
    61:'Light rain', 63:'Rain', 65:'Heavy rain',
    80:'Rain showers', 81:'Rain showers', 82:'Heavy showers',
    95:'Thunderstorm', 96:'Thunderstorm', 99:'Thunderstorm'
  };
  async function loadWeather(){
    const tempEl = document.getElementById('weatherTemp');
    const descEl = document.getElementById('weatherDesc');
    if (!tempEl) return;
    try {
      const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=12.9716&longitude=77.5946&current=temperature_2m,weather_code&timezone=Asia%2FKolkata');
      const data = await res.json();
      const temp = Math.round(data.current.temperature_2m);
      const desc = WEATHER_CODES[data.current.weather_code] || 'Bengaluru weather';
      tempEl.textContent = `${temp}°C`;
      descEl.textContent = desc;
    } catch (err) {
      descEl.textContent = 'Weather unavailable right now';
    }
  }
  loadWeather();

  // ---- Trending sidebar: top story per category, a simple honest heuristic
  // (not real engagement-based trending — just "one highlight from each beat") ----
  function renderTrending(stories){
    const list = document.getElementById('trendingList');
    if (!list) return;
    const seen = new Set();
    const picks = [];
    for (const s of stories) {
      if (!seen.has(s.cat)) {
        seen.add(s.cat);
        picks.push(s);
      }
      if (picks.length >= 4) break;
    }
    list.innerHTML = picks.map(s => `
      <div class="trending-item">
        <div class="trending-rank">${s.cat}</div>
        <a class="trending-headline" href="${s.link || '#'}" target="_blank" rel="noopener">${s.headline}</a>
      </div>
    `).join('');
  }

  // ---- Newsletter signup ----
  const newsletterForm = document.getElementById('newsletterForm');
  if (newsletterForm) {
    newsletterForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const emailInput = document.getElementById('newsletterEmail');
      const btn = document.getElementById('newsletterBtn');
      const msg = document.getElementById('newsletterMsg');
      btn.disabled = true;
      btn.textContent = 'Subscribing…';
      msg.textContent = '';
      msg.className = 'newsletter-msg';
      try {
        const res = await fetch('/api/newsletter/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: emailInput.value })
        });
        const data = await res.json();
        if (res.ok) {
          msg.textContent = "You're subscribed!";
          msg.className = 'newsletter-msg success';
          emailInput.value = '';
        } else {
          msg.textContent = data.error || 'Something went wrong';
          msg.className = 'newsletter-msg error';
        }
      } catch (err) {
        msg.textContent = 'Network error — try again';
        msg.className = 'newsletter-msg error';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Subscribe';
      }
    });
  }
</script>
</body>
